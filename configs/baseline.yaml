experiment: published_bi_baseline
seed: 68
split_seed: 68
target: b_i
model_targets: [A_e, A_i, b_e, b_i, a_1, a_2, a_3, a_4, C]

data:
  path: data/cache/upstream/xarr_noise_all_1000_1.nc
  expected_sha256: 5958968acf7fd8eedec126119e27c0b396588446b5ab61fac02c610411cf4272
  expected_bytes: 615006452
  clean_like_upstream: true
  input_scale: 100.0
  # Upstream fits MinMaxScaler before splitting. Retained only for the
  # reproduction gate and recorded as target leakage.
  target_scaler_fit: all

model:
  embed_dim: 256
  num_heads: 8
  intermediate_dim: 1024
  dropout: 0.2

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  device: cpu
  num_threads: 8

evaluation:
  published_qualitative_pearson_threshold: 0.85
  nrmse_denominator: parameter_range
  parameter_range: [25.0, 75.0]

output_dir: results/baseline/seed_68
